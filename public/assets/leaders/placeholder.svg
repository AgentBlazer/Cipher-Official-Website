<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Neutral stand-in for members/contributors without a photo yet -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff66" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f12"/>
      <stop offset="1" stop-color="#030804"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#fade)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <g fill="#00ff66" fill-opacity="0.22">
    <circle cx="300" cy="270" r="95"/>
    <path d="M110 640c0-120 85-200 190-200s190 80 190 200v160H110z"/>
  </g>
